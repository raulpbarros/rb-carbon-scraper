# Bioma
#
# Verra does not publish a biome. This infers one from location, and it is the
# weakest ruleset in the project — treat every value as a starting point.
#
# Two known limitations, stated plainly:
#   1. A state/province usually spans SEVERAL biomes. These rules assign the
#      dominant one only. A project in western Bahia sits in Cerrado, not
#      Caatinga, but the state-level rule cannot see that.
#   2. Outside Brazil the rules fall back to continent-level bands, which is
#      very coarse.
#   3. The continent-level bands read `region_name`, which only Verra
#      publishes. Gold Standard rows therefore reach the country-name rules
#      and stop there — outside the countries named below they stay blank
#      rather than being placed in a biome on a guess.
#
# Biome is only meaningful for land-use projects, so this ruleset is limited to
# AFOLU. Everything else stays blank on purpose.

column: "Bioma"

applies_when:
  # SIX vocabularies for the same sector, all carried through untranslated in
  # Tipo Macro: Verra's "Agriculture Forestry and Other Land Use", Gold
  # Standard's single type "A/R", Cercarbono's "Land use (AFOLU)", Plan Vivo
  # V5's "Afforestation / Reforestation", Plan Vivo V4's own set on the
  # legacy Markit registry — "REDD", "Forest", "Forest Restoration", "Improved
  # forest management", "Forest Conservation & Avoided Deforestation",
  # "Reduced emissions from deforestation & degradation" — and SocialCarbon's
  # bare "AFOLU". Anything else stays blank.
  #
  # This gate is load-bearing and fails silently: one unrecognised wording
  # means NO biome for any row of that registry, with nothing in the log to
  # say so. A new registry's wording belongs here before anything else.
  #
  # Blast radius of the V4 additions, measured against the real database on
  # 2026-07-29 before the change: **zero**. No project in any existing
  # registry has a Tipo Macro that the four old wordings miss and the three
  # new ones catch, so this widens the gate for Plan Vivo V4 and for nothing
  # else. Measure again before widening it further — a country band added for
  # one registry has already been shown to move rows in three others.
  #
  # SocialCarbon, 2026-08-04: 17 of its 19 projects say "Agriculture Forestry
  # and Other Land Use" and already matched. One says the bare **"AFOLU"**,
  # which `Land use \(AFOLU\)` does NOT catch — it requires the parenthesised
  # form — so that project would have had no biome and nothing in the log.
  # `\bAFOLU\b` is the addition. The nineteenth says "Harmful Algae Bloom
  # Treatment" and correctly stays out: it is not land use.
  #
  # Climate Action Reserve, 2026-08-05: 674 of its 1,277 projects already
  # passed on `[Ff]orest` alone — "Forestry - MX" (485), "Improved Forest
  # Management - ARB Compliance" (141), "Reforestation - ARB Compliance". The
  # wording that missed is **`Avoided Grassland Conversion`** (39 projects),
  # which is land use and matches none of the alternatives above. `Grassland`
  # is the addition, and it is added **together with the `na-grassland` band
  # below** — widening the gate on its own would have sent all 39 to
  # `north-america-temperate-by-code` and labelled a Montana prairie a
  # temperate forest, which is the mistake CLAUDE.md records ACR avoiding by
  # leaving the cell blank. A gate word with no band that answers it correctly
  # is worse than the blank.
  #
  # Two more CAR wordings are land use and are deliberately **left out**, for
  # exactly that reason: `Soil Enrichment` (cropland soil carbon) and the bare
  # `Avoided Conversion` (the registry states nothing finer, so which kind of
  # land is not established). No band here answers either correctly, and the
  # only one they would reach names a forest. ACR's `Agricultural Land
  # Management` and `Wetland Restoration` rows are blank for the same reason
  # and by the same decision.
  #
  # Blast radius of `Grassland`, measured against the real database on
  # 2026-08-05 before the change: **zero**. No project in any existing
  # registry has a `sectoral_scope` containing it — Verra and ACR both state
  # avoided grassland conversion in `afolu_names` and `methodologies`
  # instead, neither of which this gate reads.
  - field: sectoral_scope
    regex: "Agriculture Forestry|^A/R$|\\bAFOLU\\b|Afforestation / Reforestation|REDD|[Ff]orest|[Dd]eforestation|Grassland"

rules:
  # --- Brazil, by state (dominant biome) --------------------------------
  - name: br-amazonia
    match:
      - { field: country_name, regex: "Brazil|Brasil" }
      - { field: state_province, regex: "Acre|Amap|Amazonas|Pará|^PA$|Rondônia|Roraima|Tocantins" }
    value: "Amazônia"

  - name: br-pantanal
    match:
      - { field: country_name, regex: "Brazil|Brasil" }
      - { field: state_province, regex: "Mato Grosso do Sul|Pantanal" }
    value: "Pantanal"

  - name: br-cerrado
    match:
      - { field: country_name, regex: "Brazil|Brasil" }
      - { field: state_province, regex: "Goiás|Distrito Federal|Mato Grosso|Piauí|Maranhão|Minas Gerais" }
    value: "Cerrado"

  - name: br-caatinga
    match:
      - { field: country_name, regex: "Brazil|Brasil" }
      - { field: state_province, regex: "Ceará|Rio Grande do Norte|Paraíba|Pernambuco|Alagoas|Sergipe|Bahia" }
    value: "Caatinga"

  - name: br-pampa
    match:
      - { field: country_name, regex: "Brazil|Brasil" }
      - { field: state_province, regex: "Rio Grande do Sul" }
    value: "Pampa"

  - name: br-mata-atlantica
    match:
      - { field: country_name, regex: "Brazil|Brasil" }
      - { field: state_province, regex: "São Paulo|Rio de Janeiro|Espírito Santo|Paraná|Santa Catarina" }
    value: "Mata Atlântica"

  - name: br-unknown-state
    match:
      - { field: country_name, regex: "Brazil|Brasil" }
    value: "Brasil (bioma não determinado)"

  # --- Colombia, by department (dominant biome) --------------------------
  # Cercarbono is overwhelmingly Colombian — 140 of its 231 CO2 projects — and
  # it publishes the department. Without these rules every one of them would
  # fall through to the Amazon-basin band below, which is wrong for most of
  # the country: the Andes and the Caribbean coast are not the Amazon.
  #
  # Department names arrive unaccented from EcoRegistry ("Narino", "Cordoba"),
  # so the patterns stop before the accented vowel and match either spelling.
  - name: co-amazonia
    match:
      - { field: country_name, contains: "Colombia" }
      - { field: state_province, regex: "Amazonas|Caquet|Putumayo|Guain|Guaviare|Vaup" }
    value: "Amazônia (bacia amazônica)"

  - name: co-orinoquia
    match:
      - { field: country_name, contains: "Colombia" }
      - { field: state_province, regex: "Meta|Vichada|Arauca|Casanare" }
    value: "Orinoquía (savana de várzea)"

  - name: co-pacifico
    match:
      - { field: country_name, contains: "Colombia" }
      - { field: state_province, regex: "Choc" }
    value: "Floresta Úmida do Pacífico (Chocó)"

  - name: co-caribe
    match:
      - { field: country_name, contains: "Colombia" }
      - { field: state_province, regex: "Atl.ntico|Bol.var|Cesar|C.rdoba|Guajira|Magdalena|Sucre" }
    value: "Caribe Colombiano (bosque seco)"

  - name: co-andes
    match:
      - { field: country_name, contains: "Colombia" }
      - { field: state_province, regex: "Antioquia|Boyac|Caldas|Cauca|Cundinamarca|Huila|Nari.o|Norte de Santander|Quind|Risaralda|Santander|Tolima|Valle del Cauca|Bogot" }
    value: "Andes Colombianos"

  - name: co-unknown-department
    # The department is blank for most Cercarbono projects: EcoRegistry stores
    # the placeholder "Worldwide" where one was never entered, and the adapter
    # drops it rather than writing it into Estado. Say so, rather than placing
    # the project in a biome on the strength of the country alone.
    match:
      - { field: country_name, contains: "Colombia" }
    value: "Colômbia (bioma não determinado)"

  # --- Rest of the world, continental bands -----------------------------
  #
  # **These read a country NAME, and not every registry writes it in
  # English.** BioCarbon states its own — "Malasia", "Perú", "Panamá",
  # "México", "Brasil", "Turquía", "Estados Unidos" — carried through
  # untranslated like every registry's vocabulary. An accented or Spanish
  # spelling is invisible to an English-only pattern, and the failure is the
  # usual silent one: no biome, nothing in the log. The Spanish forms are
  # therefore alternatives below rather than a translation applied at scrape
  # time.
  #
  # Blast radius of adding them, measured against the real database on
  # 2026-08-04 before the change: **zero rows**. Every existing project in
  # every registry states its country in English, so each addition widens a
  # pattern for BioCarbon and for nothing else.
  - name: amazon-basin-neighbours
    # Colombia is handled by department above and is deliberately absent here.
    match:
      - { field: country_name, regex: "Per[uú]|Ecuador|Bolivia|Guyana|Suriname|Venezuela" }
    value: "Amazônia (bacia amazônica)"

  - name: congo-basin
    match:
      - { field: country_name, regex: "Congo|Cameroon|Gabon|Central African" }
    value: "Floresta Tropical do Congo"

  - name: southeast-asia-tropical
    match:
      - { field: country_name, regex: "Indonesia|Malaysia|Malasia|Papua|Philippines|Filipinas|Viet Nam|Cambodia|Lao|Myanmar|Thailand|Tailandia" }
    value: "Floresta Tropical do Sudeste Asiático"

  - name: miombo-woodland
    # The dominant biome across south-central Africa's dry woodland belt, and
    # what Plan Vivo's Mozambican project names explicitly. Added because
    # `region_name` — which the continental bands below read — is published by
    # Verra alone, so a Plan Vivo or Cercarbono row never reaches them.
    match:
      - { field: country_name, regex: "Mozambique|Zambia|Zimbabwe|Malawi|Tanzania|Angola" }
    value: "Miombo (savana arborizada africana)"

  - name: mesoamerica-tropical
    match:
      - { field: country_name, regex: "Guatemala|Belize|Honduras|Nicaragua|Costa Rica|Panam[aá]|El Salvador" }
    value: "Floresta Tropical Mesoamericana"

  - name: africa-savanna
    match:
      - { field: region_name, contains: "Africa" }
    value: "Savana / Floresta Africana"

  - name: latam-tropical
    match:
      - { field: region_name, regex: "South America|Central America|Latin" }
    value: "Floresta Tropical Latino-Americana"

  - name: asia-generic
    match:
      - { field: region_name, contains: "Asia" }
    value: "Ásia (bioma não determinado)"

  - name: north-america-temperate
    match:
      - { field: region_name, contains: "North America" }
    value: "Floresta Temperada Norte-Americana"

  - name: europe-temperate
    match:
      - { field: region_name, contains: "Europe" }
    value: "Floresta Temperada Europeia"

  - name: oceania
    match:
      - { field: region_name, regex: "Oceania|Australia" }
    value: "Oceania (bioma não determinado)"

  # --- North American grassland, named by the activity ---------------------
  # **The one rule in this file that reads what the project does rather than
  # only where it is**, and it is here because the alternative was worse.
  # Climate Action Reserve's Grassland Protocol certifies the avoided
  # conversion of *native* grassland to cropland, in the US and Canadian Great
  # Plains — so the project type states the biome as directly as a location
  # field would, and more precisely than the country code can. Without it the
  # 39 projects would fall through to `north-america-temperate-by-code` and be
  # labelled a temperate forest, which they are not.
  #
  # It sits above the ISO-code bands so it wins over them, and below every
  # country-name and region rule so those still win over it. Keyed on the
  # country code as well as the wording, because "grassland" outside North
  # America is a different biome and this value would be wrong for it — a
  # project that is neither US nor CA stays blank rather than being placed.
  #
  # Blast radius, measured against the real database on 2026-08-05: **zero**.
  # No existing project states a grassland wording in `sectoral_scope`.
  - name: na-grassland
    match:
      - { field: sectoral_scope, regex: "Grassland" }
      - { field: country_code, regex: "^(US|CA)$" }
    value: "Pradarias Norte-Americanas (campos temperados)"

  # --- ISO-code bands, for the registries that publish no country name ------
  # ACR states `US` and stops: no country name anywhere in its API, and
  # `region_name` is Verra's alone. Every rule above therefore misses all 994
  # of its rows, including 352 forest projects — so its Bioma would be blank
  # for the whole registry, and blank for the wrong reason. Puro's is blank
  # because it certifies no land use at all; this one would be blank because
  # of a field name.
  #
  # Last in the file on purpose: a country-name or region band is more
  # specific and must win. This only ever fires where nothing else did.
  #
  # Blast radius measured against the real database on 2026-08-04, before and
  # after the change: **4 rows added, 0 changed, 0 removed** — four Gold
  # Standard A/R projects in the US and Canada that had no biome at all. No
  # existing row moves. Measure again before widening it: a band added for one
  # registry has already been shown to move rows in three others.
  - name: north-america-temperate-by-code
    match:
      - { field: country_code, regex: "^(US|CA)$" }
    value: "Floresta Temperada Norte-Americana"

  # Climate Action Reserve is the second registry to state a code and no name,
  # and **Mexico is where that costs the most**: 485 of its 674 land-use
  # projects are `Forestry - MX`, the single largest group of land-use projects
  # the registry has. Every country band above matches a country *name*, so all
  # 485 reached nothing at all and would have come out blank, silently — the
  # failure CLAUDE.md describes, at 38% of a registry.
  #
  # The value says the country and admits the biome is not established,
  # exactly as `br-unknown-state` and `co-unknown-department` do. Mexico spans
  # temperate pine-oak forest in Oaxaca and Durango and tropical forest in
  # Campeche and Quintana Roo, and CAR publishes the state on every row — so
  # state-level bands are available here and are the obvious refinement. They
  # are deliberately **not** guessed now: the state distribution across those
  # 485 projects has not been measured, and this file's own history is that a
  # band added on an assumption moves rows in three registries nobody checked.
  # Measure it against the real database once the first full CAR sync has
  # landed, then split this rule.
  #
  # Blast radius measured against the real database on 2026-08-05, before and
  # after, over all 9,891 projects in the seven registries then loaded:
  # **3 rows added, 0 changed, 0 removed** — two Gold Standard projects and one
  # BioCarbon project that state `MX` as a code, pass the land-use gate and had
  # no biome at all. No existing row moves: Verra's 47 Mexican projects publish
  # a `region_name` and are answered by `latam-tropical` further up, which is
  # what "a name or region rule still wins" means here. (ACR's rows were still
  # being written by a live sync at the time and are not in that count; it
  # publishes no `MX` project, so this rule cannot reach it.)
  # **The state split this rule asked for, measured.** The note below said to
  # measure the state distribution once the first full CAR sync had landed and
  # then split. It landed on 2026-08-05 and the 491 Mexican projects are:
  # Chihuahua 67, Durango 64, Hidalgo 59, State of México 52, Oaxaca 45,
  # Michoacán 45, Quintana Roo 39, Jalisco 36, Campeche 28, Puebla 13,
  # Veracruz 13, Guerrero 7, Aguascalientes 6, Yucatán 5, Chiapas 3,
  # Tabasco 3, Distrito Federal 2, and one each in Querétaro, Tlaxcala,
  # Morelos and Coahuila.
  #
  # Only **half** of that split is made here, and the half that is not is the
  # point. The Yucatán peninsula and the Gulf states are the Selva Maya and
  # its tropical surroundings — one biome, unambiguous, and **already in this
  # file's vocabulary**, so 90 projects move onto an existing value with no
  # new wording invented for them. (91 projects are in those states; the
  # extra one is a Yucatán *livestock* project, which the land-use gate at the
  # top of this file correctly keeps out.)
  #
  # The other 394 stay "not determined" deliberately. They are the highlands —
  # Sierra Madre pine-oak — which is a *temperate conifer* biome, and the only
  # temperate value here is called "Norte-Americana". Whether a Michoacán
  # community forest should read that, or a new Sierra Madre band, is a
  # question about the deliverable rather than something either registry
  # published: Oaxaca and Guerrero straddle both zones, and CAR states a state
  # and nothing finer. Raised in `docs/field-mapping.md` instead of guessed —
  # the same call ACR's blank `País` and the wetland rows got.
  #
  # Blast radius, measured against the real database on 2026-08-05:
  # **90 rows changed, 0 added, 0 removed**, all of them CAR's. No other
  # registry is reachable: this pair needs a `country_code` *and* a Mexican
  # state, and Verra's 47 Mexican projects publish neither — they carry a
  # `region_name` and are answered by `latam-tropical` further up.
  - name: mx-selva-maya
    match:
      - { field: country_code, regex: "^MX$" }
      - field: state_province
        regex: "QUINTANA ROO|CAMPECHE|YUCAT.N|CHIAPAS|TABASCO|VERACRUZ"
    value: "Floresta Tropical Mesoamericana"

  - name: mexico-by-code
    match:
      - { field: country_code, regex: "^MX$" }
    value: "México (bioma não determinado)"
