# Tipo Micro de Projeto
#
# "Tipo Macro" is NOT here — it is Verra's own `sectoralScope` field, copied
# straight through. This file only classifies the finer-grained type.
#
# Inputs available on each row (project table column names):
#   sectoral_scope, methodologies, afolu_names, project_name,
#   country_name, region_name, state_province, city, project_size
#
# AFOLU codes come from Verra's own `afoluNames` field, so those rules are
# reliable. The sectoral-scope fallbacks below are a first pass — review them.
#
# First matching rule wins. No match = blank cell.

column: "Tipo Micro de Projeto"

rules:
  # --- AFOLU: driven by Verra's own sub-type codes -----------------------
  - name: afolu-arr
    match: [{ field: afolu_names, any_of: [ARR] }]
    value: "Florestamento, Reflorestamento e Revegetação (ARR)"

  - name: afolu-redd
    match: [{ field: afolu_names, any_of: [REDD] }]
    value: "Desmatamento e Degradação Evitados (REDD)"

  - name: afolu-ifm
    match: [{ field: afolu_names, any_of: [IFM] }]
    value: "Manejo Florestal Melhorado (IFM)"

  - name: afolu-alm
    match: [{ field: afolu_names, any_of: [ALM] }]
    value: "Manejo Agrícola de Terras (ALM)"

  - name: afolu-wrc
    match: [{ field: afolu_names, any_of: [WRC] }]
    value: "Restauração e Conservação de Áreas Úmidas (WRC)"

  - name: afolu-acogs
    match: [{ field: afolu_names, any_of: [ACoGS] }]
    value: "Conservação de Pastagens e Campos (ACoGS)"

  # --- Land-use methodologies, for registries with no AFOLU sub-type code -
  # Cercarbono states no equivalent of Verra's `afoluNames`, so the rules
  # above never fire for its rows. Its methodology strings do name the
  # activity, though, and they are the closest thing it publishes to a
  # sub-type. These sit above the energy rules below because a land-use
  # methodology is the more specific reading; they cannot mis-fire on Verra
  # rows, where the same codes mean the same thing.
  #
  # `AR-ACM0003` is spelled out rather than matched as `ACM0003`: the bare
  # code is a cement-manufacture methodology, and the two are unrelated.
  - name: methodology-afforestation
    match:
      - field: methodologies
        regex: "AR-ACM0003|AR-AMS0003|M/UT/F-A01|BCR0001|Reforestation|Afforestation|Forest Restoration"
    value: "Florestamento, Reflorestamento e Revegetação (ARR)"

  # --- Puro.earth methodologies -------------------------------------------
  # Puro publishes exactly one classification of what a project does — the
  # methodology — and no sector vocabulary at all, so the same string reaches
  # both Tipo Macro and Metodologia and these rules key on it. None of them can
  # fire on another registry: no other registry publishes these names.
  #
  # They sit above the sectoral-scope fallbacks below for the usual reason, and
  # above nothing else: Puro certifies engineered and hybrid removals, so no
  # AFOLU or energy rule was ever going to match them.
  - name: puro-biochar
    match: [{ field: methodologies, regex: "Biochar" }]
    value: "Biochar"

  - name: puro-enhanced-rock-weathering
    match: [{ field: methodologies, regex: "Enhanced Rock Weathering" }]
    value: "Intemperismo Acelerado de Rochas (ERW)"

  - name: puro-carbonated-materials
    match: [{ field: methodologies, regex: "Carbonated Materials" }]
    value: "Materiais Carbonatados"

  - name: puro-geological-storage
    match: [{ field: methodologies, regex: "Geologically stored carbon" }]
    value: "Captura e Armazenamento de Carbono"

  - name: puro-wooden-building-elements
    match: [{ field: methodologies, regex: "Wooden Building Elements" }]
    value: "Produtos de Madeira (armazenamento em construção)"

  - name: puro-terrestrial-biomass
    match: [{ field: methodologies, regex: "Terrestrial Storage of Biomass" }]
    value: "Armazenamento Terrestre de Biomassa"

  - name: puro-soil-amendment
    match: [{ field: methodologies, regex: "Soil Amendment" }]
    value: "Condicionador de Solo (carbono no solo)"

  - name: methodology-redd
    match: [{ field: methodologies, regex: "REDD" }]
    value: "Desmatamento e Degradação Evitados (REDD)"

  - name: methodology-forest-wetland-modular
    match: [{ field: methodologies, regex: "M/LU/F-W01" }]
    value: "Manejo Florestal Melhorado (IFM)"

  # --- BioCarbon's own methodology numbers -------------------------------
  # BioCarbon publishes no AFOLU sub-type code either, and its methodology
  # *names* carry both the number and the activity — "BCR0001_Actividades
  # ARR", "BCR0002_… Proyectos REDD+". The CDM methodologies it also uses
  # (AR-ACM0003, ACM0001, ACM0002, AMS-I.*, AMS-III.F/H) are matched by the
  # rules above unchanged, which is why only the BCR-numbered ones appear
  # here. The codes exist on no other registry, so these rules cannot reach
  # another registry's rows.
  #
  # Deliberately absent: BCR0006 (petrol-to-natural-gas vehicle conversion).
  # There is no transport value in this vocabulary and inventing one is a
  # business decision, so that project's cell stays blank — the correct
  # failure, per the note at the top of this file.
  - name: bcr-improved-forest-management
    match: [{ field: methodologies, regex: "BCR0010" }]
    value: "Manejo Florestal Melhorado (IFM)"

  - name: bcr-wetlands-and-blue-carbon
    # BCR0004 continental wetlands, BCR0007 wetland conservation and
    # restoration, BCR0012 blue carbon.
    match: [{ field: methodologies, regex: "BCR0004|BCR0007|BCR0012" }]
    value: "Restauração e Conservação de Áreas Úmidas (WRC)"

  - name: bcr-natural-savanna
    # Avoided land-use change in natural savanna — grassland and shrubland
    # conservation, which is what ACoGS covers on Verra.
    match: [{ field: methodologies, regex: "BCR0005" }]
    value: "Conservação de Pastagens e Campos (ACoGS)"

  - name: bcr-high-mountain
    # Avoided land-use change in high-mountain ecosystems (páramo). Genuinely
    # AFOLU, and genuinely not one of the sub-types this vocabulary has.
    match: [{ field: methodologies, regex: "BCR0003" }]
    value: "AFOLU (subtipo não informado)"

  - name: methodology-land-use-generic
    match: [{ field: methodologies, regex: "NTC 6208|land use" }]
    value: "AFOLU (subtipo não informado)"

  # --- ACR's protocol names ----------------------------------------------
  # ACR publishes no AFOLU sub-type code either, and its `projectType` is too
  # coarse for the forest half of the registry: 352 projects read "Forest
  # Carbon", covering improved management, reforestation, avoided conversion
  # and wetland restoration alike. The protocol name is what separates them,
  # and it is stated on 994 of 994.
  #
  # These key on strings no other registry publishes ("ARB Compliance Offset
  # Protocol", "ECY Compliance Offset Protocol", "Improved Forest Management
  # (IFM) on …"), so they cannot reach another registry's rows. Measured
  # against the live index on 2026-08-04.
  - name: acr-improved-forest-management
    match:
      - field: methodologies
        regex: "Improved Forest Management \\(IFM\\)|Active Conservation and Sustainable Management"
    value: "Manejo Florestal Melhorado (IFM)"

  # The compliance forest protocols cover reforestation, improved management
  # AND avoided conversion under one name, and the registry states nothing
  # finer. The generic AFOLU value says exactly that instead of picking one.
  - name: acr-compliance-forest-protocol
    match:
      - field: methodologies
        regex: "Compliance Offset Protocol: U\\.S\\. Forest Projects|Climate Action Reserve Forest Project Protocol"
    value: "AFOLU (subtipo não informado)"

  - name: acr-avoided-grassland-conversion
    match:
      - field: methodologies
        regex: "Avoided Conversion of Grasslands"
    value: "Conservação de Pastagens e Campos (ACoGS)"

  - name: acr-wetland-restoration
    match:
      - field: methodologies
        regex: "Restoration of Pocosin Wetlands|Restoration of California Deltaic"
    value: "Restauração e Conservação de Áreas Úmidas (WRC)"

  - name: acr-agricultural-land-management
    match:
      - field: methodologies
        regex: "Reduced Use of Fertilizer|Rice Management Systems"
    value: "Manejo Agrícola de Terras (ALM)"

  # Destruction of ODS banks, and the foam/blowing-agent transitions that sit
  # in the same programme. An avoided emission, not a removal — see
  # durability.yaml.
  - name: acr-ozone-depleting-substances
    match:
      - field: methodologies
        regex: "Ozone Depleting Substances"
    value: "Destruição de Substâncias Destruidoras da Camada de Ozônio (ODS)"

  # The foam blowing-agent transitions belong here and **not** with the ODS
  # destruction protocols: all 82 of them are "Industrial Process Emissions"
  # in the registry's own vocabulary, and what they avoid is high-GWP
  # fluorinated blowing agent, not an ozone-depleting bank. Filing them as ODS
  # contradicted the registry's own type as well as the chemistry.
  - name: acr-refrigerants
    match:
      - field: methodologies
        regex: "Reclaimed HFC Refrigerants|Advanced Refrigeration Systems|Advanced Formulation Blowing Agents"
    value: "Refrigerantes e Gases Fluorados (HFC)"

  - name: acr-mine-methane
    match:
      - field: methodologies
        regex: "Mine Methane Capture|Methane from Coal and Trona Mines"
    value: "Metano de Minas de Carvão"

  - name: acr-orphan-wells
    match:
      - field: methodologies
        regex: "Plugging Orphan Oil and Gas Wells"
    value: "Tamponamento de Poços Órfãos"

  - name: acr-landfill-gas
    match:
      - field: methodologies
        regex: "Landfill Gas Destruction|Landfill Gas Combustion"
    value: "Gás de Aterro Sanitário"

  - name: acr-manure-management
    match:
      - field: methodologies
        regex: "Methane from Manure Management Systems"
    value: "Pecuária e Manejo de Dejetos"

  - name: acr-vehicle-efficiency
    match:
      - field: methodologies
        regex: "Anti-Idling Technologies|Truck Stop Electrification|Improved Efficiency of Vehicle Fleet"
    value: "Eficiência Energética no Transporte"

  - name: acr-enhanced-oil-recovery
    match:
      - field: methodologies
        regex: "Enhanced Oil Recovery"
    value: "Captura e Armazenamento de Carbono"

  - name: acr-pneumatic-controllers
    match:
      - field: methodologies
        regex: "High-Bleed Pneumatic Controllers"
    value: "Emissões Fugitivas"

  # --- Methodology-specific, where the scope alone is too coarse ---------
  - name: methodology-cookstoves
    match: [{ field: methodologies, regex: "AMS-II\\.G|VMR0006|VMR0013" }]
    value: "Fogões Eficientes"

  - name: methodology-water-purification
    match: [{ field: methodologies, regex: "AMS-III\\.AV" }]
    value: "Purificação de Água"

  - name: methodology-landfill-gas
    match: [{ field: methodologies, regex: "ACM0001|AMS-III\\.G" }]
    value: "Gás de Aterro Sanitário"

  - name: methodology-composting
    match: [{ field: methodologies, regex: "AMS-III\\.F|ACM0022" }]
    value: "Compostagem e Tratamento de Resíduos"

  - name: methodology-recycling
    match:
      - field: methodologies
        regex: "AMS-III\\.AJ|M/CE-R01|CM-WM-ELV-01|Recycling"
    value: "Reciclagem e Recuperação de Materiais"

  - name: methodology-wastewater
    match: [{ field: methodologies, regex: "AMS-III\\.H|ACM0014" }]
    value: "Tratamento de Efluentes"

  - name: methodology-biochar
    match: [{ field: methodologies, regex: "VM0044" }]
    value: "Biochar"

  - name: methodology-wind
    match: [{ field: methodologies, regex: "ACM0002" }]
    value: "Energia Renovável Conectada à Rede"

  - name: methodology-small-scale-renewable
    match: [{ field: methodologies, regex: "AMS-I\\." }]
    value: "Energia Renovável de Pequena Escala"

  # --- Gold Standard project types --------------------------------------
  # Gold Standard states a `type` instead of a sectoral scope, from a closed
  # list of 20 values (all of them enumerated below, from a full sync on
  # 2026-07-28). These use `equals` against that vocabulary, so they can never
  # match a Verra row — Verra's scopes are long descriptive strings.
  #
  # They sit ABOVE the Verra fallbacks on purpose: "Energy Efficiency -
  # Transport Sector" would otherwise be caught by the broad `contains:
  # Transport` rule and lose the efficiency reading.
  #
  # `Other` (350 projects) is deliberately absent — no rule, blank cell.
  - name: gs-afforestation
    match: [{ field: sectoral_scope, equals: "A/R" }]
    value: "Florestamento, Reflorestamento e Revegetação (ARR)"

  - name: gs-ee-domestic
    match: [{ field: sectoral_scope, equals: "Energy Efficiency - Domestic" }]
    value: "Eficiência Energética Doméstica"

  - name: gs-ee-industrial
    match: [{ field: sectoral_scope, equals: "Energy Efficiency - Industrial" }]
    value: "Eficiência Energética Industrial"

  - name: gs-ee-transport
    match: [{ field: sectoral_scope, equals: "Energy Efficiency - Transport Sector" }]
    value: "Eficiência Energética no Transporte"

  - name: gs-ee-other-sectors
    match:
      - field: sectoral_scope
        in:
          - "Energy Efficiency - Commercial Sector"
          - "Energy Efficiency - Public Sector"
          - "Energy Efficiency - Agriculture Sector"
    value: "Eficiência Energética"

  - name: gs-wind
    match: [{ field: sectoral_scope, equals: "Wind" }]
    value: "Energia Eólica"

  - name: gs-solar-pv
    match: [{ field: sectoral_scope, equals: "PV" }]
    value: "Energia Solar Fotovoltaica"

  - name: gs-solar-thermal
    match:
      - field: sectoral_scope
        in: ["Solar Thermal - Electricity", "Solar Thermal - Heat"]
    value: "Energia Solar Térmica"

  - name: gs-hydro
    match: [{ field: sectoral_scope, equals: "Small, Low - Impact Hydro" }]
    value: "Pequenas Centrais Hidrelétricas"

  - name: gs-geothermal
    match: [{ field: sectoral_scope, equals: "Geothermal" }]
    value: "Energia Geotérmica"

  - name: gs-biogas
    match:
      - field: sectoral_scope
        in: ["Biogas - Heat", "Biogas - Electricity", "Biogas - Cogeneration"]
    value: "Biogás"

  - name: gs-biomass
    match:
      - field: sectoral_scope
        in:
          - "Biomass, or Liquid Biofuel - Heat"
          - "Biomass, or Liquid Biofuel - Electricity"
          - "Biomass, or Liquid Biofuel - Cogeneration"
    value: "Biomassa e Biocombustíveis"

  # --- Plan Vivo project types ------------------------------------------
  # Plan Vivo leaves `sectoralScope` null and states a `projectType` instead,
  # which the adapter carries into `sectoral_scope` untranslated. Every project
  # in the registry today reads "Afforestation / Reforestation" (2 of 2 on
  # 2026-07-28), so this vocabulary is one value deep and will grow. An
  # unrecognised future value leaves the cell blank, which is the correct
  # failure — do not add a catch-all here.
  #
  # `equals` rather than `contains`: it cannot reach a Verra or Cercarbono row,
  # whose scopes are long descriptive strings.
  - name: pv-afforestation
    match: [{ field: sectoral_scope, equals: "Afforestation / Reforestation" }]
    value: "Florestamento, Reflorestamento e Revegetação (ARR)"

  # --- Plan Vivo V4, on the legacy Markit registry -----------------------
  #
  # V4 publishes NO methodology and NO AFOLU sub-type code — `sectoral_scope`
  # is the only thing it states, so every rule above that keys on
  # `methodologies` or `afolu_names` misses it entirely. Before these rules
  # only 10 of its 30 projects had a Tipo Micro, all of them the one wording
  # V5 shares.
  #
  # `equals`, like the V5 rule above and for the same reason: these are short
  # exact vocabulary values and must not reach a Verra or Cercarbono row whose
  # scopes are long descriptive strings. The values are the existing AFOLU
  # sub-type ones, reused deliberately — a V4 REDD project and a Verra REDD
  # project belong in the same bucket, and a new wording must never quietly
  # become a new category.
  #
  # Where one project id covers several rows the adapter joins the distinct
  # types with "; ", so those land here as a compound string and stay blank
  # rather than being forced into one bucket. That is the correct failure.
  - name: pv4-redd
    match: [{ field: sectoral_scope, equals: "REDD" }]
    value: "Desmatamento e Degradação Evitados (REDD)"

  - name: pv4-avoided-deforestation
    match:
      - field: sectoral_scope
        equals: "Forest Conservation & Avoided Deforestation"
    value: "Desmatamento e Degradação Evitados (REDD)"

  - name: pv4-reduced-emissions-deforestation
    match:
      - field: sectoral_scope
        equals: "Reduced emissions from deforestation & degradation"
    value: "Desmatamento e Degradação Evitados (REDD)"

  - name: pv4-improved-forest-management
    match: [{ field: sectoral_scope, equals: "Improved forest management" }]
    value: "Manejo Florestal Melhorado (IFM)"

  - name: pv4-forest-restoration
    match: [{ field: sectoral_scope, equals: "Forest Restoration" }]
    value: "Florestamento, Reflorestamento e Revegetação (ARR)"

  - name: pv4-agriculture-land-management
    match: [{ field: sectoral_scope, equals: "Agriculture land management" }]
    value: "Manejo Agrícola de Terras (ALM)"

  # "Forest" on its own is what the registry states for one project, and it
  # names no sub-type. The generic AFOLU value says exactly that rather than
  # guessing which kind of forest project it is.
  - name: pv4-forest-unspecified
    match: [{ field: sectoral_scope, equals: "Forest" }]
    value: "AFOLU (subtipo não informado)"

  # --- ACR project types -------------------------------------------------
  # ACR states a `projectType` from a closed list of 17 values, which the
  # adapter carries into `sectoral_scope` untranslated. These are the rows the
  # protocol rules above did not already answer — a project whose protocol is
  # one of the handful ACR does not name in its own vocabulary.
  #
  # `equals` against short exact values, like the Gold Standard and Plan Vivo
  # blocks: they cannot reach a Verra or Cercarbono row, whose scopes are long
  # descriptive strings. They sit above the generic fallbacks so that
  # "Renewable Energy" is not read by `contains: Energy` rules that mean
  # something narrower.
  #
  # Deliberately absent: "Fuel Switching" (2 projects). There is no value in
  # this vocabulary for it and inventing one is a business decision, so the
  # cell stays blank — the correct failure, per the note at the top.
  - name: acr-forest-carbon
    match: [{ field: sectoral_scope, equals: "Forest Carbon" }]
    value: "AFOLU (subtipo não informado)"

  - name: acr-type-ods
    match: [{ field: sectoral_scope, equals: "Ozone Depleting Substances" }]
    value: "Destruição de Substâncias Destruidoras da Camada de Ozônio (ODS)"

  - name: acr-type-refrigerants
    match: [{ field: sectoral_scope, equals: "Refrigerants" }]
    value: "Refrigerantes e Gases Fluorados (HFC)"

  - name: acr-type-coal-mine-methane
    match: [{ field: sectoral_scope, equals: "Coal Mine Methane" }]
    value: "Metano de Minas de Carvão"

  - name: acr-type-orphaned-wells
    match: [{ field: sectoral_scope, equals: "Orphaned Wells" }]
    value: "Tamponamento de Poços Órfãos"

  - name: acr-type-landfill-gas
    match:
      - field: sectoral_scope
        equals: "Landfill Gas Capture & Combustion"
    value: "Gás de Aterro Sanitário"

  - name: acr-type-industrial-process
    match:
      - field: sectoral_scope
        in: ["Industrial Process Emissions", "Industrial Gas Substitution"]
    value: "Emissões de Processos Industriais"

  - name: acr-type-wetland-restoration
    match: [{ field: sectoral_scope, equals: "Wetland Restoration" }]
    value: "Restauração e Conservação de Áreas Úmidas (WRC)"

  - name: acr-type-agricultural-land-management
    match: [{ field: sectoral_scope, equals: "Agricultural Land Management" }]
    value: "Manejo Agrícola de Terras (ALM)"

  - name: acr-type-wastewater
    match: [{ field: sectoral_scope, equals: "Wastewater Treatment" }]
    value: "Tratamento de Efluentes"

  - name: acr-type-renewable-energy
    match: [{ field: sectoral_scope, equals: "Renewable Energy" }]
    value: "Energia Renovável"

  - name: acr-type-energy-efficiency
    match: [{ field: sectoral_scope, equals: "Energy Efficiency" }]
    value: "Eficiência Energética"

  - name: acr-type-transport
    match: [{ field: sectoral_scope, equals: "Transport / Fleet Efficiency" }]
    value: "Eficiência Energética no Transporte"

  # --- Climate Action Reserve project types --------------------------------
  # CAR states a `Project Type` from a list of **32 values**, which the adapter
  # carries into `sectoral_scope` untranslated. Unlike ACR — where one
  # `projectType` covered 352 forest projects and only the protocol name told
  # them apart — CAR's own type is already the fine-grained vocabulary:
  # "Improved Forest Management - ARB Compliance" and "Reforestation - ARB
  # Compliance" are two of its values, not one.
  #
  # **That is why these key on the type and not on `Protocol and Version`.**
  # The protocol name is the project type followed by the protocol document
  # and its edition — "Forestry - MX - Version 2.0", "Mine Methane Capture -
  # ARB Compliance - ARB Compliance Offset Protocol Mine Methane Capture,
  # April 25, 2014" — so it restates the type and adds an edition, not a finer
  # classification. And it is published on *issuance* rows, which 376 of the
  # 1,277 projects do not have: a methodology-keyed rule would leave every one
  # of those blank for a reason that has nothing to do with what they are.
  #
  # **They sit here, below the Plan Vivo V4 block, and that position was
  # measured rather than chosen.** Every operator in this engine is
  # case-insensitive, and Plan Vivo V4 publishes "Improved forest management"
  # against CAR's "Improved Forest Management" — the two differ by case alone,
  # so no pattern can tell them apart and only rule order can. Hoisting this
  # block above the V4 rules was tried and re-attributed 8 Plan Vivo values to
  # CAR rules: the same values, under the wrong rule name, which is precisely
  # what `project_derived.rule_name` exists to prevent.
  #
  # The cost of sitting this low is one thing to check after the first full
  # sync, not to assume: the ACR protocol rules above match
  # "Compliance Offset Protocol: U.S. Forest Projects" and "Climate Action
  # Reserve Forest Project Protocol", and CAR's own `Protocol and Version`
  # strings name a compliance protocol too. None of the protocol strings in
  # the fixtures collides, but the forest ones there use the short
  # "- Version 3.1" form and the long form has not been seen. **Count
  # `project_derived.rule_name` over CAR rows after the first sync**; any CAR
  # row attributed to an `acr-` rule means the two vocabularies do overlap and
  # this block has to move up — with the V4 collision solved first.
  #
  # The collision is symmetric and one CAR wording pays for it: a project whose
  # type is the bare "Improved Forest Management" is answered by
  # `pv4-improved-forest-management` above rather than by `car-improved-forest-
  # management` here. **The value is identical** — both say IFM, deliberately,
  # because an IFM project stores carbon the same way in either registry — so
  # only `project_derived.rule_name` reads oddly. It is left alone rather than
  # fixed by narrowing a working registry's rule for a cosmetic attribution,
  # and it is recorded here so the next person does not read it as a bug.
  #
  # `regex` on stems rather than `equals`, because the same activity appears
  # with three compliance suffixes (`- ARB Compliance`, `- WA ECO Compliance`,
  # `- U.S.`) and the list is 32 values of which 13 are visible in the
  # fixtures. Each pattern was checked against every existing registry's
  # `sectoral_scope` on 2026-08-05 and reaches none of them.
  #
  # **The other 19 values are not here and their cells will be blank.** That is
  # the correct failure, per the note at the top of this file — but it is a
  # measurable one: run `verra coverage -r car` after the first full sync and
  # add the wordings it shows, rather than guessing them now.
  - name: car-forestry-mx
    # Mexico's Forest Protocol, 485 projects and the registry's largest single
    # type. It covers reforestation, improved management AND avoided conversion
    # under one name and states nothing finer, which is the same position ACR's
    # compliance forest protocol is in — so it gets the same honest answer
    # rather than one of the three picked.
    match: [{ field: sectoral_scope, regex: "^Forestry - MX" }]
    value: "AFOLU (subtipo não informado)"

  - name: car-improved-forest-management
    match: [{ field: sectoral_scope, regex: "^Improved Forest Management" }]
    value: "Manejo Florestal Melhorado (IFM)"

  - name: car-reforestation
    match: [{ field: sectoral_scope, regex: "^Reforestation" }]
    value: "Florestamento, Reflorestamento e Revegetação (ARR)"

  - name: car-avoided-grassland-conversion
    match: [{ field: sectoral_scope, regex: "Avoided Grassland Conversion" }]
    value: "Conservação de Pastagens e Campos (ACoGS)"

  - name: car-avoided-conversion
    # The bare wording, with no land type attached. It is avoided land-use
    # change and the registry says nothing more, so neither does this.
    match: [{ field: sectoral_scope, equals: "Avoided Conversion" }]
    value: "AFOLU (subtipo não informado)"

  - name: car-soil-enrichment
    # CAR's Soil Enrichment Protocol: soil carbon on cropland and grazing land.
    match: [{ field: sectoral_scope, equals: "Soil Enrichment" }]
    value: "Manejo Agrícola de Terras (ALM)"

  - name: car-ozone-depleting-substances
    match: [{ field: sectoral_scope, regex: "^Ozone Depleting Substances" }]
    value: "Destruição de Substâncias Destruidoras da Camada de Ozônio (ODS)"

  - name: car-landfill-gas
    match: [{ field: sectoral_scope, regex: "^Landfill Gas" }]
    value: "Gás de Aterro Sanitário"

  - name: car-mine-methane
    match: [{ field: sectoral_scope, regex: "Mine Methane Capture" }]
    value: "Metano de Minas de Carvão"

  - name: car-nitric-and-adipic-acid
    # Nitrous-oxide abatement in nitric and adipic acid manufacture. An
    # industrial process emission, and the registry's own two wordings for it.
    match:
      - field: sectoral_scope
        regex: "^Nitric Acid|^Adipic Acid"
    value: "Emissões de Processos Industriais"

  # Livestock is deliberately absent: "Livestock - ARB Compliance" and
  # "Livestock Gas Capture/Combustion" are both answered by `scope-livestock`
  # below, which already reads `contains: Livestock`. Adding a CAR rule for it
  # would be a second place to change the same answer.

  # --- the eleven wordings the first full sync named ----------------------
  # The note above said to run `verra coverage -r car` after the first full
  # sync and add what it showed rather than guessing now. It showed **52
  # projects across 11 project types** with no Tipo Micro and no Durabilidade,
  # and these are them. Every value is an existing one; nothing new was
  # invented for a registry whose vocabulary happens to be worded differently.
  #
  # Three of the eleven are a rule above being **too narrow**, not a missing
  # activity, and they are worth reading as a pattern: `equals` and `^`-anchored
  # patterns both miss this registry's compliance suffixes and its country
  # suffixes, which is the same shape as `afolu-generic` missing ACR.
  - name: car-avoided-conversion-compliance
    # `Avoided Conversion - ARB Compliance`. `car-avoided-conversion` above
    # uses `equals`, so the compliance suffix missed it.
    match: [{ field: sectoral_scope, regex: "^Avoided Conversion" }]
    value: "AFOLU (subtipo não informado)"

  - name: car-canada-grassland
    # CAR's Canada Grassland Protocol — avoided conversion of native grassland
    # to cropland, the same activity as `Avoided Grassland Conversion` with a
    # country in the name instead of the activity. Same value, deliberately.
    match: [{ field: sectoral_scope, equals: "Canada Grassland" }]
    value: "Conservação de Pastagens e Campos (ACoGS)"

  - name: car-conservation-based-forest-management
    # Managing a working forest for higher standing stock. IFM under another
    # name, and it gets IFM's value for the same reason `car-forest-stock`
    # does: the carbon is stored the same way.
    match: [{ field: sectoral_scope, equals: "Conservation-Based Forest Management" }]
    value: "Manejo Florestal Melhorado (IFM)"

  - name: car-coal-mine-methane
    # `Coal Mine Methane - VAM` and `- Drainage`. `car-mine-methane` reads
    # "Mine Methane Capture", which is a *different* wording of the same
    # activity — this registry uses both.
    match: [{ field: sectoral_scope, regex: "^Coal Mine Methane" }]
    value: "Metano de Minas de Carvão"

  - name: car-landfill-mx
    # `Landfill - MX`, the Mexican landfill protocol. `car-landfill-gas` is
    # anchored on "Landfill Gas" and this one does not say "Gas".
    match: [{ field: sectoral_scope, equals: "Landfill - MX" }]
    value: "Gás de Aterro Sanitário"

  - name: car-biochar
    match: [{ field: sectoral_scope, equals: "Biochar" }]
    value: "Biochar"

  - name: car-organic-waste-composting
    match: [{ field: sectoral_scope, equals: "Organic Waste Composting" }]
    value: "Compostagem e Tratamento de Resíduos"

  - name: car-organic-waste-digestion
    # Anaerobic digestion of food and organic waste. The gas is the product,
    # which is what separates it from composting above.
    match: [{ field: sectoral_scope, equals: "Organic Waste Digestion" }]
    value: "Biogás"

  - name: car-nitrogen-management
    # Reduced nitrous oxide from fertiliser on cropland — an agricultural land
    # management activity, and the same value CAR's Soil Enrichment gets.
    match: [{ field: sectoral_scope, equals: "Nitrogen Management" }]
    value: "Manejo Agrícola de Terras (ALM)"

  - name: car-low-carbon-cement
    # **Not "Materiais Carbonatados".** Puro's carbonated materials mineralise
    # CO2 into the product and store it; CAR's Low Carbon Cement Protocol
    # credits a cement made with less clinker, which is a process emission that
    # never happened. Reusing the storage value would have said the opposite of
    # what the project does.
    match: [{ field: sectoral_scope, equals: "Low Carbon Cement" }]
    value: "Emissões de Processos Industriais"

  # --- Sectoral-scope fallbacks -----------------------------------------
  - name: scope-energy-industries
    match: [{ field: sectoral_scope, contains: "Energy industries" }]
    value: "Energia Renovável"

  - name: scope-energy-demand
    match: [{ field: sectoral_scope, contains: "Energy demand" }]
    value: "Eficiência Energética"

  - name: scope-energy-distribution
    match: [{ field: sectoral_scope, contains: "Energy distribution" }]
    value: "Distribuição de Energia"

  - name: scope-waste
    match: [{ field: sectoral_scope, contains: "Waste handling" }]
    value: "Resíduos"

  - name: scope-livestock
    match: [{ field: sectoral_scope, contains: "Livestock" }]
    value: "Pecuária e Manejo de Dejetos"

  - name: scope-transport
    match: [{ field: sectoral_scope, contains: "Transport" }]
    value: "Transporte"

  - name: scope-manufacturing
    match: [{ field: sectoral_scope, contains: "Manufacturing" }]
    value: "Indústria de Transformação"

  - name: scope-fugitive
    match: [{ field: sectoral_scope, contains: "Fugitive" }]
    value: "Emissões Fugitivas"

  - name: scope-chemical
    match: [{ field: sectoral_scope, contains: "Chemical" }]
    value: "Indústria Química"

  - name: scope-mining
    match: [{ field: sectoral_scope, regex: "Mining|Mineral" }]
    value: "Mineração"

  - name: scope-metal
    match: [{ field: sectoral_scope, contains: "Metal" }]
    value: "Metalurgia"

  - name: scope-construction
    match: [{ field: sectoral_scope, contains: "Construction" }]
    value: "Construção"

  - name: scope-ccs
    match: [{ field: sectoral_scope, regex: "Carbon capture|CCS" }]
    value: "Captura e Armazenamento de Carbono"

  - name: scope-afolu-generic
    # Verra says "Agriculture Forestry and Other Land Use"; Cercarbono says
    # "Land use (AFOLU)". Same sector, two vocabularies, both carried through
    # untranslated in Tipo Macro — so the rule has to recognise both.
    match: [{ field: sectoral_scope, regex: "Agriculture Forestry|Land use \\(AFOLU\\)" }]
    value: "AFOLU (subtipo não informado)"

  - name: scope-ecosystem-conservation
    match: [{ field: sectoral_scope, contains: "Ecosystem conservation" }]
    value: "Conservação de Ecossistemas"

  - name: scope-technological-cycle
    match: [{ field: sectoral_scope, contains: "Technological cycle" }]
    value: "Economia Circular"
