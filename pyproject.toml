[project]
name = "carbon-registry-scraper"
version = "0.2.0"
description = "Scrapes the public carbon registries into SQLite and exports a formatted Excel sheet."
requires-python = ">=3.11"
# Kept deliberately small: every entry here is weight in the packaged EXE.
# `pandas` and `pydantic` were declared but imported nowhere, and cost roughly
# 60-80 MB in a PyInstaller bundle; do not add them back without a use.
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.7",
    "openpyxl>=3.1",
    "pyyaml>=6.0",
    "tenacity>=8.3",
]

[project.optional-dependencies]
# Developer-only. `discover` is a diagnostic, not the data path, and Playwright
# is excluded from the packaged build.
dev = [
    "playwright>=1.44",
    "pytest>=8.2",
]
build = [
    "pyinstaller>=6.6",
]

[project.scripts]
verra = "carbon_scraper.cli:app"
carbon = "carbon_scraper.cli:app"

# `gui-scripts`, not `scripts`: on Windows this builds a pythonw-backed
# launcher, so double-clicking the shortcut opens the window without a console
# flashing up behind it. Tkinter is in the standard library, so this adds no
# dependency and no bundle weight.
[project.gui-scripts]
carbon-gui = "carbon_scraper.gui.app:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
