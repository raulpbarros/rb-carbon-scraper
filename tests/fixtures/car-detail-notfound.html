<SCRIPT language="javascript">
    //---timer start here
    var timeInSecs
    var timerID = null
    var runningTimer = false
    var delay = 1000

    function InitializeScriptTimer(sec)
    {
        //--Set the timer in seconds--
        timeInSecs = sec
         StopPageClock()
        StartPageTimer()
    }

    function StopPageClock()
    {
        if(runningTimer)
            clearTimeout(timerID)
        runningTimer = false
    }

    function StartPageTimer()
    {
        if (timeInSecs == 600)
        {
            StopPageClock()
            modalWin(timeInSecs)
            InitializeScriptTimer(1800);
        }
        else
        {
            timeInSecs = timeInSecs - 1
            runningTimer = true
            timerID = self.setTimeout("StartPageTimer()", delay)

        }
        return;
    }

    function modalWin(sec)
    {
        if (window.showModalDialog)
        {
           window.showModalDialog("/myModule/include/displayWarning.asp?t="+ timeInSecs,"Warning","dialogWidth:550px;dialogHeight:240px;status:no;center:yes;dialogTop:285;dialogLeft:275");
        }
        else
        {
           window.open('/myModule/include/displayWarning.asp?t="+ timeInSecs','Warning','width=550,height=240,toolbar=no,directories=no,status=no,menubar=no,scrollbars=no,resizable=no,modal=yes');
        }
    }
</script>
